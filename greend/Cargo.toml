[package]
name = "greend"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = "0.39.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["process", "io-std", "fs", "rt", "io-util", "signal", "sync", "macros", "parking_lot"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

