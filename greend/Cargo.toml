[package]
name = "greend"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
plist = "1.8.0"
rusqlite = "0.39.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["process", "io-std", "fs", "rt", "io-util", "signal", "sync", "macros", "time", "parking_lot"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
codegen-units = 1
strip = true